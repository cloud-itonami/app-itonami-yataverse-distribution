model:
  provider: murakumo
  base_url: https://api.murakumo.cloud/v1
  default: mishima
  max_tokens: 4096
  context_length: 131072
providers:
  murakumo:
    base_url: https://api.murakumo.cloud/v1
    api_mode: chat_completions
    key_env: MURAKUMO_FLEET_API_KEY
    stale_timeout_seconds: 120
    request_timeout_seconds: 180
fallback_providers: []
agent:
  max_turns: 12
  run_budget_seconds: 180
  reasoning_effort: none
platform_toolsets:
  cli: [terminal, file]
mcp_servers: {}
terminal:
  backend: local
  timeout: 60
